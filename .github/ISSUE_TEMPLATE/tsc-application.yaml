name: TSC Application
description: Use this template if you are interested in applying to join the Chapel Technical Steering Committee (TSC)
title: "[TSC Application]: "
labels: ["TSC Application"]
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true

  - type: input
    id: github-username
    attributes:
      label: GitHub Username
    validations:
      required: true

  - type: textarea
    id: affiliations
    attributes:
      label: Affiliations
      description:  |
        List any relevant workplaces, schools, professional groups
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        List any notable projects or products you have worked on, listing names, and providing links if available.

  - type: textarea
    id: projects
    attributes:
      label: Notable projects/products
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Provide a paragraph or two indicating your history and experience with the Chapel language, project, and community

  - type: textarea
    id: experience
    attributes:
      label: Chapel Experience
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Provide a paragraph or two indicating your motivations for applying to the TSC, explaining what you hope to bring to the TSC and what you hope to get out of it

  - type: textarea
    id: motivation
    attributes:
      label: Motivations for Applying
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Is there someone on the TSC or in the Chapel community who knows you and is willing to advocate on your behalf?

  - type: input
    id: advocate
    attributes:
      label: Advocate/Sponsor (Optional)
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Please disclose anything that could prevent you from meeting the [expectations for TSC members](GOVERNANCE.md) or that you think we ought to know

  - type: input
    id: conflicts
    attributes:
      label: Conflicts of Interest
    validations:
      required: false
