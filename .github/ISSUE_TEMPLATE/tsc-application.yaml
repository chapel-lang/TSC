name: TSC Application
description: Use this template if you are interested in applying to join the Chapel Technical Steering Committee (TSC)
title: "[TSC Application]: "
labels: ["TSC Application"]
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true

  - type: input
    id: github-username
    attributes:
      label: GitHub Username
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Please list any relevant workplaces, schools, professional groups

  - type: textarea
    id: affiliations
    attributes:
      label: Affiliations
    validations:
      required: true

  - type: textarea
    id: projects
    attributes:
      label: Notable projects/products you have worked on (list names, provide links if available)
    validations:
      required: true

  - type: textarea
    id: experience
    attributes:
      label: History and experience with the Chapel language, project, and community (please provide a paragraph or two summarizing your past involvement with Chapel)
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivations for applying to the TSC (please provide a paragraph or two explaining what you hope to bring to the TSC and what you hope to get out of it)
    validations:
      required: true

  - type: input
    id: advocate
    attributes:
      label: Advocate/Sponsor (Optional — Is there someone on the TSC or in the Chapel community who knows you and is willing to advocate on your behalf?)
    validations:
      required: false

  - type: input
    id: conflicts
    attributes:
      label: Conflicts of Interest (Please disclose anything that could prevent you from meeting the [expectations for TSC members](GOVERNANCE.md) or that you think we ought to know)
    validations:
      required: false
