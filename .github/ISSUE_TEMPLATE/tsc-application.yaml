name: TSC Application
description: Use this template if you are interested in applying to join the Chapel Technical Steering Committee (TSC)
title: "[TSC Application]: "
labels: ["TSC Application"]
body:
  - type: markdown
    attributes:
      value: |
      ## Valued attributes in TSC candidates
      The following is a non-exhaustive list of things we will consider and value in a TSC candidate.  Please note that we don't expect applicants to meet all of the following criteria, nor does meeting any of them guarantee acceptance into the TSC.  We will consider applications holistically:
      * uses of Chapel in applications
      * contributions to the Chapel community in the form of PRs (code, doc changes)
      * involvement in Chapel discussions and issues
      * organizing of, or participation in, Chapel community events (such as ChapelCon)
      * having publications, blog posts, or social media activity related to Chapel
      * providing funding to the Chapel project or other Chapel-related development efforts
      * unique perspectives, strengths, or experiences that you'd bring
      * other potential benefits to the project

  - type: markdown
    attributes:
      value: |
      ## To apply to the Chapel TSC, please fill out the following application:

  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: E-mail Address
    validations:
      required: true

  - type: input
    id: github-username
    attributes:
      label: GitHub Username
    validations:
      required: true

  - type: textarea
    id: affiliations
    attributes:
      label: Affiliations
      description: |
        List any relevant workplaces, schools, and professional groups.
    validations:
      required: true

  - type: textarea
    id: projects
    attributes:
      label: Notable projects/products
      description: |
        List the names of any notable projects or products you have worked on,  providing links if available.
    validations:
      required: true

  - type: textarea
    id: experience
    attributes:
      label: Chapel Experience
      description: |
        Provide a paragraph or two indicating your history and experience with the Chapel language, project, and community.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivations for Applying
      description: |
        Provide a paragraph or two indicating your motivations for applying to the TSC.  Describe what you hope to bring to the TSC and what you hope to get out of it.
    validations:
      required: true

  - type: input
    id: advocate
    attributes:
      label: Advocate/Sponsor (Optional)
      description: |
        Is there someone on the TSC or in the Chapel community who knows you and would be willing to advocate on your behalf?
    validations:
      required: false

  - type: input
    id: conflicts
    attributes:
      label: Conflicts of Interest
      description: |
        Please disclose anything that could prevent you from meeting the [expectations for TSC members](https://github.com/chapel-lang/governance/blob/main/GOVERNANCE.md#technical-steering-committee-tsc) or that you think we ought to know.
    validations:
      required: false

  - type: checkboxes
    id: expectations
    attributes:
      label: TSC Member Expectations
      description: By filing this issue, you agree to the [expectations of TSC members](https://github.com/chapel-lang/governance/blob/main/GOVERNANCE.md#technical-steering-committee-tsc)
      options:
        - label: I have reviewed the expectations of TSC members and agree to them
          required: true
        - label: I understand that TSC meetings currently take place during U.S. working hours
          required: true
